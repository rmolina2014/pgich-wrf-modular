version: '3.9'
services:
  pgich-ui:
    build: .
    container_name: pgich_ui
    ports:
      - "8501:8501"
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./:/workspace/repo
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
